<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lobby Check">
<meta name="theme-color" content="#86C0DF">
<title>Lobby Checklist</title>
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#86C0DF; --blue-d:#4D98C4; --blue-dd:#2E77A3; --blue-l:#E7F3FA; --blue-ll:#F4F9FC;
  --orange:#F0B662; --orange-d:#D9952F; --orange-l:#FDF1DE;
  --ink:#454A50; --muted:#868D94; --line:#DCE8F0; --white:#fff; --bg:#F4F9FC;
  --ok:#4FB487; --repair:#E5636A; --clean:#F0A23C; --replace:#9C7FD6; --other:#5E8FC9; --none:#B9C3CB;
  --r:16px; --shadow:0 6px 24px rgba(46,119,163,.14); --shadow-s:0 2px 8px rgba(46,119,163,.12);
  --head:'Mali','Noto Sans Thai',sans-serif; --body:'Noto Sans Thai',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;overscroll-behavior:none}
body{display:grid;grid-template-rows:auto 1fr;height:100%;-webkit-user-select:none;user-select:none}
input,textarea,select,button{font:inherit;color:inherit}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{font-family:var(--head);margin:0;font-weight:700}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top));background:var(--white);border-bottom:1px solid var(--line);box-shadow:var(--shadow-s);z-index:20;position:relative}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand img{height:40px;width:auto;display:block}
.brand .t{line-height:1.05}
.brand .t b{font-family:var(--head);font-size:19px;color:var(--orange-d);letter-spacing:.5px}
.brand .t b span{color:var(--blue-d)}
.brand .t small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:1.5px}
.spacer{flex:1}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sel,.date{height:40px;border:1.5px solid var(--line);border-radius:12px;padding:0 10px;background:var(--blue-ll);min-width:0}
.sel{max-width:190px}
.date{width:150px}
.seg{display:flex;background:var(--blue-l);border-radius:13px;padding:3px;gap:2px}
.seg button{height:34px;padding:0 12px;border-radius:10px;font-weight:600;color:var(--blue-dd);white-space:nowrap}
.seg button.on{background:var(--white);box-shadow:var(--shadow-s);color:var(--orange-d)}
.ib{height:40px;min-width:40px;padding:0 11px;border-radius:12px;background:var(--blue-ll);border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;color:var(--blue-dd);position:relative;white-space:nowrap}
.ib:active{transform:scale(.96)}
.ib svg{width:20px;height:20px;flex:none}
.ib .cnt{position:absolute;top:-6px;right:-6px;background:var(--repair);color:#fff;border-radius:10px;font-size:11px;min-width:20px;height:20px;line-height:20px;padding:0 5px;border:2px solid #fff}
.ib .cnt:empty{display:none}
.ib .sdot{position:absolute;right:5px;bottom:5px;width:10px;height:10px;border-radius:50%;background:var(--sc,#B9C3CB);border:2px solid #fff}
.ib.spin-dot .sdot{animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}

/* ---------- stage ---------- */
main{position:relative;overflow:hidden;min-height:0}
#plan{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;background:
  radial-gradient(circle at 20% 10%,#fff 0,transparent 60%),var(--bg)}
.obj{cursor:pointer}
.edit .obj{cursor:move}
.banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--orange-l);border:1.5px solid var(--orange);color:#8a5a14;padding:6px 14px;border-radius:999px;font-weight:600;z-index:6;display:none;align-items:center;gap:8px;box-shadow:var(--shadow-s);white-space:nowrap}
.banner.show{display:flex}
.banner button{color:var(--blue-dd);text-decoration:underline;font-weight:700}

.float{position:absolute;z-index:5;background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.zoom{right:14px;bottom:86px;display:flex;flex-direction:column;padding:4px;gap:2px}
.zoom button{width:44px;height:44px;border-radius:12px;font-size:22px;color:var(--blue-dd);display:flex;align-items:center;justify-content:center}
.zoom button:active{background:var(--blue-l)}
.zoom svg{width:20px;height:20px}
body.drawer-open .zoom{right:426px}

/* palette */
.palette{left:12px;top:12px;bottom:86px;width:96px;overflow-y:auto;padding:6px;display:none;-webkit-overflow-scrolling:touch}
.edit .palette{display:block}
.palette h4{font-size:11px;color:var(--blue-dd);margin:6px 0 4px;padding:6px 4px;font-weight:700;text-align:center;line-height:1.25;background:var(--blue-ll);border-radius:10px;cursor:pointer;position:relative}
.palette h4 i{display:block;font-style:normal;font-size:10px;color:var(--muted);transition:transform .2s}
.palette .pg.closed h4 i{transform:rotate(-90deg)}
.palette .pg.closed .pi{display:none}
.palette button{width:100%;padding:6px 2px 5px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;line-height:1.15;color:var(--ink)}
.palette button:active{background:var(--orange-l)}
.palette button svg{width:46px;height:34px}

/* edit toolbar */
.etools{top:12px;left:122px;display:none;padding:5px;gap:4px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 140px)}
.edit .etools{display:flex}
body.drawer-open .etools{max-width:calc(100% - 560px)}
.etools button{height:40px;min-width:40px;padding:0 10px;border-radius:11px;color:var(--blue-dd);font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.etools button svg{width:20px;height:20px}
.etools button.on{background:var(--blue-l)}
.etools button:disabled{opacity:.35}
.etools .ai{background:linear-gradient(135deg,var(--orange),#F5CB85);color:#5b3a07}
.etools .sep{width:1px;height:26px;background:var(--line);margin:0 2px}

/* bottom bar */
.bbar{left:12px;right:12px;bottom:12px;padding:10px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:max(10px,env(safe-area-inset-bottom))}
body.drawer-open .bbar{right:424px}
body.drawer-open .legend{display:none}
.prog{flex:1;min-width:180px}
.prog .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:10px}
.prog .row b{font-family:var(--head);color:var(--blue-dd);font-size:15px}
.bar{height:10px;border-radius:6px;background:var(--blue-l);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.btn{height:44px;padding:0 16px;border-radius:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--blue-l);color:var(--blue-dd);white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--blue-d);color:#fff;box-shadow:0 3px 10px rgba(77,152,196,.35)}
.btn.org{background:var(--orange);color:#4d3105}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:#FCE9EA;color:#B8323A}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:11px}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.5}

/* ---------- drawer ---------- */
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(412px,100%);background:var(--white);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(46,119,163,.12);z-index:10;transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dh{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px;background:linear-gradient(180deg,var(--blue-ll),#fff)}
.dh>div{flex:1;min-width:0}
.dh h2{font-size:21px;color:var(--blue-dd);overflow-wrap:anywhere}
.eyebrow{font-size:12px;color:var(--orange-d);font-weight:700;letter-spacing:.5px;margin-bottom:2px}
.sub{font-size:13px;color:var(--muted)}
.x{width:40px;height:40px;border-radius:12px;background:var(--blue-l);color:var(--blue-dd);font-size:22px;line-height:1;flex:none}
.db{flex:1;overflow-y:auto;padding:14px 18px 20px;-webkit-overflow-scrolling:touch}
.df{padding:12px 18px;padding-bottom:max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:#fff}
.df .btn{flex:1}
.lbl{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 7px;letter-spacing:.3px}
.lbl:first-child{margin-top:2px}
.in,.ta{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--blue-ll);outline:none;font-size:16px}
.in{height:44px}
.in:focus,.ta:focus{border-color:var(--blue);background:#fff}
.ta{min-height:84px;resize:vertical;line-height:1.5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fld small{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.status{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status button{min-height:52px;border-radius:14px;border:2px solid var(--line);background:#fff;display:flex;align-items:center;gap:8px;padding:6px 10px;font-weight:600;text-align:left;line-height:1.2}
.status button .dot{width:16px;height:16px}
.status button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff);color:color-mix(in srgb,var(--c) 70%,#000)}
.status button:first-child{grid-column:1/-1;justify-content:center;font-size:16px}
.checks{display:flex;flex-direction:column;gap:6px}
.ck{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--blue-ll);border:1.5px solid transparent;min-height:50px}
.ck.on{background:#EAF7F0;border-color:#BFE6D1}
.ck .bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--blue);background:#fff;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.ck.on .bx{background:var(--ok);border-color:var(--ok)}
.ck .bx svg{width:16px;height:16px;opacity:0}
.ck.on .bx svg{opacity:1}
.empty{color:var(--muted);font-size:13.5px;padding:10px 12px;background:var(--blue-ll);border-radius:12px}
.info{border-radius:12px;padding:10px 12px;font-size:13.5px;background:var(--orange-l);border:1px solid #F5D7A6;line-height:1.5}
.info.blue{background:var(--blue-l);border-color:#CBE3F1}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;background:var(--c);white-space:nowrap}
.photo{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.photo img{width:110px;height:82px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.hist{display:flex;flex-direction:column;gap:6px}
.hist .h{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:var(--blue-ll);font-size:13.5px}
.hist .h .d{font-weight:700;min-width:84px;color:var(--blue-dd)}
.hist .h .n{color:var(--muted);flex:1;overflow-wrap:anywhere}
.mini-seg{display:flex;gap:6px}
.mini-seg button{flex:1;height:40px;border-radius:11px;border:2px solid var(--line);background:#fff;font-weight:600}
.mini-seg button.on{border-color:var(--orange);background:var(--orange-l);color:#8a5a14}
.objlist{display:flex;flex-direction:column;gap:4px;max-height:none}
.objlist button{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:11px;background:var(--blue-ll);text-align:left;font-size:14px}
.objlist button svg{width:34px;height:26px;flex:none}
.objlist button small{color:var(--muted);margin-left:auto;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--blue-d)}
.colors{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.colors button{width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.colors button.on{box-shadow:0 0 0 3px var(--blue-d)}
.colors input[type=color]{width:36px;height:36px;border:0;padding:0;background:none}

/* issue cards */
.card{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#fff}
.card.urgent{border-color:#F3B3B6;background:#FFF7F7}
.card h3{font-size:16px;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .meta{font-size:12.5px;color:var(--muted);margin:4px 0 6px}
.card .note{font-size:14px;line-height:1.5;margin-bottom:8px;overflow-wrap:anywhere}
.card img{width:100%;max-height:160px;object-fit:cover;border-radius:10px;margin-bottom:8px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{height:34px;padding:0 12px;border-radius:999px;background:var(--blue-ll);border:1.5px solid var(--line);font-size:13px;font-weight:600}
.tabs button.on{background:var(--blue-d);border-color:var(--blue-d);color:#fff}

/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h b{font-family:var(--head);font-size:17px;color:var(--blue-dd)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:12px;color:var(--muted);font-weight:700;padding:4px 0}
.cal button{aspect-ratio:1;border-radius:12px;background:var(--blue-ll);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;font-size:14px;position:relative}
.cal button:disabled{opacity:.3}
.cal button.blank{visibility:hidden}
.cal button.today{box-shadow:inset 0 0 0 2px var(--orange)}
.cal button.cur{background:var(--blue-d);color:#fff}
.cal button i{width:7px;height:7px;border-radius:50%;display:block}
.dl{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.dl button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--blue-ll);text-align:left}
.dl button .d{font-weight:700;color:var(--blue-dd);min-width:100px}
.dl button .s{font-size:12.5px;color:var(--muted);flex:1;display:flex;gap:6px;flex-wrap:wrap}

/* modal */
.mwrap{position:fixed;inset:0;background:rgba(40,70,95,.35);z-index:50;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.mwrap.show{display:flex}
.modal{background:#fff;border-radius:22px;box-shadow:0 20px 60px rgba(30,70,100,.3);width:min(620px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;overflow:hidden}
.modal.wide{width:min(980px,100%)}
.modal .mh{padding:18px 20px 10px;display:flex;align-items:center;gap:10px}
.modal .mh h2{flex:1;font-size:21px;color:var(--blue-dd)}
.modal .mb{padding:4px 20px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal .mf{padding:12px 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line)}
.muted{color:var(--muted);font-size:13.5px;line-height:1.55}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips button{padding:7px 12px;border-radius:999px;background:var(--orange-l);border:1px solid #F5D7A6;font-size:13px;text-align:left;color:#6b4710}
.actlist{margin-top:12px;display:flex;flex-direction:column;gap:5px;max-height:300px;overflow-y:auto}
.actlist div{padding:7px 10px;border-radius:10px;background:var(--blue-ll);font-size:13.5px;display:flex;gap:8px}
.actlist .add b{color:var(--ok)} .actlist .upd b{color:var(--blue-d)} .actlist .del b{color:var(--repair)}
.spin{width:20px;height:20px;border:3px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.rep table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
.rep th,.rep td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.rep th{background:var(--blue-l);color:var(--blue-dd)}
.rep .plan{border:1px solid var(--line);border-radius:14px;padding:8px;background:#fff}
.rep .plan svg{width:100%;height:auto;display:block}
.rep .sumrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.kpi{flex:1;min-width:110px;background:var(--blue-ll);border-radius:12px;padding:8px 12px}
.kpi b{display:block;font-family:var(--head);font-size:24px;color:var(--blue-dd)}
.kpi span{font-size:12px;color:var(--muted)}
.meter{height:8px;background:var(--blue-l);border-radius:5px;overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:var(--blue-d)}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-weight:600;z-index:80;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#B8323A}
.toast.ok{background:#2f8a62}

@keyframes pulse{0%{opacity:.9}70%{opacity:0}100%{opacity:0}}
.pulse{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pr{0%{transform:scale(1)}70%{transform:scale(2.1)}100%{transform:scale(2.1)}}
.pulse{animation:pulse 1.8s ease-out infinite,pr 1.8s ease-out infinite}

@media (max-width:1100px){ .brand .t small{display:none} .ib .tx{display:none} }
@media (max-width:860px){
  .brand .t{display:none}
  .date{width:140px}
  .legend{display:none}
  body.drawer-open .bbar,body.drawer-open .etools{display:none}
  body.drawer-open .zoom{display:none}
}
@media print{
  html,body{height:auto;overflow:visible;display:block;background:#fff}
  .top,main,.toast{display:none!important}
  .mwrap{position:static;display:block!important;background:none;padding:0;backdrop-filter:none}
  .modal{box-shadow:none;max-height:none;width:100%!important;border-radius:0}
  .modal .mb{overflow:visible}
  .noprint{display:none!important}
}
</style>
</head>
<body>

function load(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function store(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch (e) { toast('บันทึกไม่สำเร็จ: พื้นที่จัดเก็บเต็ม ลองลบรูปเก่าหรือสำรองข้อมูลแล้วล้าง', 'err', 5000); return false; }
}

/* ---------- colour helpers ---------- */
function shade(hex, p) {
  let h = String(hex || '#999').replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16); if (isNaN(n)) return hex;
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = p < 0 ? 0 : 255, k = Math.abs(p);
  r = Math.round((t - r) * k + r); g = Math.round((t - g) * k + g); b = Math.round((t - b) * k + b);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

/* ---------- shape drawing (top view, local box 0..w × 0..h) ---------- */
function drawShape(type, w, h, c, o = {}) {
  const sk = shade(c, -.32), lt = shade(c, .45), m = Math.min(w, h);
  const sw = clamp(m * .045, 1.2, 4);
  const R = (x, y, ww, hh, rx, f, s, extra = '') => `<rect x="${x}" y="${y}" width="${Math.max(0, ww)}" height="${Math.max(0, hh)}" rx="${rx}" fill="${f}" ${s ? `stroke="${s}" stroke-width="${sw}"` : ''} ${extra}/>`;
  const L = (x1, y1, x2, y2, s, wd = sw) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${s}" stroke-width="${wd}" stroke-linecap="round"/>`;
  switch (type) {
    case 'table_rect': return R(1,1,w-2,h-2,m*.08,c,sk) + R(w*.08,h*.12,w*.84,h*.76,m*.05,'none',lt,`stroke="${lt}" stroke-width="${sw*.8}"`);
    case 'table_round': return `<ellipse cx="${w/2}" cy="${h/2}" rx="${w/2-1}" ry="${h/2-1}" fill="${c}" stroke="${sk}" stroke-width="${sw}"/><ellipse cx="${w/2}" cy="${h/2}" rx="${w*.36}" ry="${h*.36}" fill="none" stroke="${lt}" stroke-width="${sw*.8}"/>`;
    case 'chair': return R(w*.1,h*.2,w*.8,h*.76,m*.18,c,sk) + R(w*.03,h*.02,w*.94,h*.24,m*.1,sk,null);
    case 'sofa': return R(w*.1,h*.25,w*.8,h*.72,m*.08,c,sk) + L(w*.1+w*.8/3,h*.32,w*.1+w*.8/3,h*.9,lt) + L(w*.1+w*.8*2/3,h*.32,w*.1+w*.8*2/3,h*.9,lt)
      + R(0,0,w,h*.3,m*.12,sk,null) + R(0,0,w*.12,h,m*.1,shade(c,-.18),sk) + R(w*.88,0,w*.12,h,m*.1,shade(c,-.18),sk);
    case 'cabinet': return R(1,1,w-2,h-2,m*.06,c,sk) + L(w/2,h*.18,w/2,h*.92,sk) + L(2,h-2,w-2,h-2,sk,sw*2)
      + `<circle cx="${w/2-m*.16}" cy="${h*.62}" r="${m*.06}" fill="${sk}"/><circle cx="${w/2+m*.16}" cy="${h*.62}" r="${m*.06}" fill="${sk}"/>`;

}

function syncPropFields() {

function nextName(name) {

}

  list.sort((a, b) => (prioRank[a.rec.prio] ?? 1) - (prioRank[b.rec.prio] ?? 1) || a.since.localeCompare(b.since));
  const counts = {}; list.forEach(i => counts[i.rec.status] = (counts[i.rec.status] || 0) + 1);
  const shown = tab === 'all' ? list : tab === 'urgent' ? list.filter(i => i.rec.prio === 'urgent') : list.filter(i => i.rec.status === tab);
  const html = head('ต้องดำเนินการ', 'งานค้าง / จุดที่ต้องแก้ไข', `ณ ${thDate(viewDate)} · ${list.length} รายการ`) + `<div class="db">

/* ---------- history panel ---------- */
function openHistory(month) {
  const pr = records[curPlanId] || {};
  const m = month || viewDate.slice(0, 7);
  const [Y, M] = m.split('-').map(Number);
  const first = new Date(Y, M - 1, 1), days = new Date(Y, M, 0).getDate(), lead = first.getDay();
  const total = plan().objects.filter(inspectable).length, td = today();
  let cal = ['อา','จ','อ','พ','พฤ','ศ','ส'].map(d => `<div class="wd">${d}</div>`).join('');
  for (let i = 0; i < lead; i++) cal += '<button class="blank" disabled></button>';
  for (let d = 1; d <= days; d++) {
    const ds = `${Y}-${pad(M)}-${pad(d)}`, recs = pr[ds] || {}, vals = Object.values(recs);
    const bad = vals.filter(r => r.status !== 'ok').length;
    const dot = !vals.length ? '' : `<i style="background:${bad ? '#E5636A' : vals.length >= total ? '#4FB487' : '#F0B662'}"></i>`;
    cal += `<button data-d="${ds}" class="${ds === td ? 'today' : ''} ${ds === viewDate ? 'cur' : ''}" ${ds > td ? 'disabled' : ''}>${d}${dot}</button>`;
  }
  const dates = Object.keys(pr).sort().reverse();
  const prevM = ymd(new Date(Y, M - 2, 1)).slice(0, 7), nextM = ymd(new Date(Y, M, 1)).slice(0, 7);
  const html = head('ประวัติย้อนหลัง', esc(plan().name), `${dates.length} วันที่มีบันทึก`) + `<div class="db">
    <div class="cal-h"><button class="btn sm" id="hPrev">‹</button><b>${first.toLocaleDateString('th-TH', {month:'long', year:'numeric'})}</b><button class="btn sm" id="hNext" ${nextM > td.slice(0, 7) ? 'disabled' : ''}>›</button></div>
    <div class="cal">${cal}</div>
    <div class="legend" style="margin-top:8px;display:flex"><span><i class="dot" style="background:#4FB487"></i>ครบ/ปกติ</span><span><i class="dot" style="background:#F0B662"></i>ตรวจไม่ครบ</span><span><i class="dot" style="background:#E5636A"></i>พบปัญหา</span></div>
    <div class="lbl">รายการวันที่บันทึก</div>
    <div class="dl">${dates.slice(0, 60).map(d => { const v = Object.values(pr[d]); const ok = v.filter(r => r.status === 'ok').length, bad = v.length - ok;
      return `<button data-d="${d}"><span class="d">${thDate(d)}</span><span class="s"><span>ตรวจ ${v.length}/${total}</span><span style="color:var(--ok)">ปกติ ${ok}</span>${bad ? `<span style="color:var(--repair)">ปัญหา ${bad}</span>` : ''}</span>›</button>`; }).join('') || '<div class="empty">ยังไม่มีข้อมูล</div>'}</div>
    <div class="lbl">ส่งออกข้อมูล</div>
    <div class="row"><button class="btn sm" id="hCsv">⬇ CSV (เปิดใน Excel)</button><button class="btn sm" id="hRep">📄 รายงานวันที่เลือก</button></div>
  </div>`;
  showDrawer('history', html, {month: m});
  $('#hPrev').onclick = () => openHistory(prevM); $('#hNext').onclick = () => openHistory(nextM);
  drawerEl.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { setDate(b.dataset.d); openHistory(b.dataset.d.slice(0, 7)); });
  $('#hCsv').onclick = exportCSV; $('#hRep').onclick = openReport;
}

/* ---------- export / import ---------- */
function download(name, data, type) {
  if (IN_ARTIFACT) return showExport(name, data);
  const blob = new Blob([data], {type}), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function showExport(name, data) {

    catch (_) { ta.focus(); ta.select(); toast('เลือกข้อความแล้ว กดคัดลอกได้เลย'); } };
}
function exportCSV() {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['วันที่','ผัง','จุดตรวจ','ประเภท','สถานะ','ความเร่งด่วน','ผ่าน/ทั้งหมด','ข้อที่ไม่ผ่าน','หมายเหตุ','ผู้ตรวจ','เวลา','วันที่แก้ไขเสร็จ','หมายเหตุการแก้ไข','มีรูป']];
  for (const p of plans) { const pr = records[p.id] || {};
    for (const d of Object.keys(pr).sort()) for (const [oid, r] of Object.entries(pr[d])) {
      const o = p.objects.find(x => x.id === oid), items = r.items || [];
      rows.push([d, p.name, o ? o.name : r.name, (TYPES[o ? o.type : r.type] || TYPES.rect).n, STATUS[r.status] ? STATUS[r.status].n : r.status, r.status === 'ok' ? '' : PRIO[r.prio] || '',
        `${(r.done || []).filter(Boolean).length}/${items.length}`, items.filter((_, j) => !r.done[j]).join('; '), r.note, r.by, thTime(r.time),
        r.resolved ? r.resolved.date : '', r.resolved ? r.resolved.note : '', r.photo ? 'มี' : '']);
    } }
  download(`lobby-checklist-${today()}.csv`, '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
}

/* ---------- AI (ChatGPT API) ---------- */
async function callAI(messages) {
  if (IN_ARTIFACT) throw new Error('ฟีเจอร์ AI ใช้ได้เมื่อเปิดจากไฟล์ HTML เท่านั้น (หน้าเว็บบน claude.ai ไม่อนุญาตให้เชื่อมต่อ OpenAI)');
  if (!settings.apiKey) { const e = new Error('ยังไม่ได้ใส่ API Key — ไปที่ ⚙️ ตั้งค่า'); e.noKey = true; throw e; }
  const res = await fetch(settings.baseUrl.replace(/\/+$/, '') + '/chat/completions', {
    method: 'POST', headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + settings.apiKey},
    body: JSON.stringify({model: settings.model, messages, response_format: {type: 'json_object'}})
  }).catch(() => { throw new Error('เชื่อมต่อไม่ได้ (ตรวจสอบอินเทอร์เน็ต)'); });
  if (!res.ok) { let m = ''; try { m = (await res.json()).error.message; } catch (_) {} throw new Error(`API ${res.status}${m ? ': ' + m : ''}`); }
  const j = await res.json(); let txt = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
  txt = txt.trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  try { return JSON.parse(txt); } catch (_) { throw new Error('AI ตอบกลับไม่ใช่ JSON ที่ถูกต้อง ลองใหม่อีกครั้ง'); }
}

${Object.entries(TYPES).map(([k, v]) => `${k}: ${v.n} ${v.w}×${v.h}`).join('\n')}

      <textarea class="ta" id="fbCfg" rows="8" placeholder='const firebaseConfig = {\n  apiKey: "AIza...",\n  authDomain: "....firebaseapp.com",\n  projectId: "...",\n  appId: "1:...:web:..."\n};'></textarea>
      <div class="row" style="margin-top:10px"><button class="btn pri" id="fbCfgSave">บันทึก config</button></div>`;
    $('#fbCfgSave').onclick = () => { const c = parseFbConfig($('#fbCfg').value); if (!c) return toast('อ่าน config ไม่ได้ ต้องมี apiKey, projectId และ appId', 'err', 3500);
      settings.fb = c; saveSettings(); renderSyncModal(); fbStart(); };
    return;
  }
  const head = `<div class="muted" style="margin-bottom:8px">โปรเจกต์ Firebase: <b>${esc(cfg.projectId)}</b></div><div id="syncStat">${syncStatHtml()}</div>`;
  if (!fb.authKnown) { box.innerHTML = head + '<p class="muted" style="margin-top:12px">กำลังเชื่อมต่อ…</p>'; fbStart(); return; }
  if (!fb.user) {
    box.innerHTML = head + `<div class="lbl">เข้าสู่ระบบ (บัญชีที่สร้างไว้ใน Firebase)</div>
      <input class="in" id="fbEmail" type="email" autocomplete="username" placeholder="อีเมล" value="${esc(settings.fbEmail || '')}">
      <input class="in" id="fbPw" type="password" autocomplete="current-password" placeholder="รหัสผ่าน" style="margin-top:8px">
      <div class="row" style="margin-top:10px"><button class="btn pri" id="fbIn">เข้าสู่ระบบ</button>${FIREBASE_CONFIG ? '' : '<button class="btn sm ghost" id="fbReset">เปลี่ยน config</button>'}</div>`;
    const go = async () => { const btn = $('#fbIn'), em = $('#fbEmail').value.trim(), pw = $('#fbPw').value;
      if (!em || !pw) return toast('กรอกอีเมลและรหัสผ่าน', 'err');
      btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
      try { await signIn(em, pw); settings.fbEmail = em; saveSettings(); }
      catch (e) { setSync('signedout', fbErr(e)); btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ'; } };
    $('#fbIn').onclick = go; $('#fbPw').onkeydown = e => { if (e.key === 'Enter') go(); };
    const r = $('#fbReset'); if (r) r.onclick = () => { delete settings.fb; saveSettings(); location.reload(); };
    return;
  }
  box.innerHTML = head + `<div class="info blue" style="margin-top:12px">เข้าสู่ระบบเป็น <b>${esc(fb.user.email || '')}</b><br>ทุกเครื่องที่เข้าสู่ระบบด้วยบัญชีนี้จะเห็นผังและผลตรวจชุดเดียวกัน และอัปเดตอัตโนมัติ</div>
    <div class="row" style="margin-top:12px"><button class="btn pri" id="fbNow">ซิงก์ตอนนี้</button><button class="btn ghost" id="fbOut">ออกจากระบบ</button></div>
    <p class="muted">ถ้าไม่มีอินเทอร์เน็ตก็ใช้งานได้ตามปกติ ข้อมูลจะถูกส่งขึ้นเมื่อกลับมาออนไลน์</p>`;
  $('#fbNow').onclick = () => { if (!fb.unsub.length) onSignedIn(); else flush(); };
  $('#fbOut').onclick = () => confirmBox('ออกจากระบบซิงก์?', 'ข้อมูลในเครื่องนี้ยังอยู่ แต่จะไม่ซิงก์กับเครื่องอื่นจนกว่าจะเข้าสู่ระบบใหม่', 'ออกจากระบบ', () => signOut().then(() => toast('ออกจากระบบแล้ว')));
}
window.addEventListener('online', () => { if (fb.user) { flush(); setSync(pending() ? 'syncing' : 'ok'); } });
window.addEventListener('offline', () => { if (fb.user) setSync('offline'); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && pending()) flush(); });
setInterval(() => { if (pending() && !fb.flushing) flush(); }, 30000);

/* ---------- modal / toast ---------- */
function modal(title, body, foot, wide) {
  const m = $('#modal'); m.className = 'modal' + (wide ? ' wide' : ''); delete m.dataset.lock;
  m.innerHTML = `<div class="mh"><h2>${title}</h2><button class="x noprint" data-close aria-label="ปิด">×</button></div><div class="mb">${body}</div><div class="mf noprint">${foot}</div>`;
  $('#mwrap').classList.add('show');
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
}
function closeModal() { $('#mwrap').classList.remove('show'); }
$('#mwrap').addEventListener('pointerdown', e => { if (e.target.id === 'mwrap' && !$('#modal').dataset.lock) closeModal(); });
function confirmBox(title, msg, okText, fn, danger) {
  modal(esc(title), msg ? `<p class="muted">${esc(msg)}</p>` : '', `<button class="btn ghost" data-close>ยกเลิก</button><button class="btn ${danger ? 'danger' : 'pri'}" id="cOk">${esc(okText)}</button>`);
  $('#cOk').onclick = () => { closeModal(); fn(); };
}
function promptBox(title, ph, val, fn, multi) {
  modal(esc(title), multi ? `<textarea class="ta" id="pIn" placeholder="${esc(ph)}">${esc(val)}</textarea>` : `<input class="in" id="pIn" placeholder="${esc(ph)}" value="${esc(val)}">`,
    `<button class="btn ghost" data-close>ยกเลิก</button><button class="btn pri" id="pOk">ตกลง</button>`);
  const i = $('#pIn'); setTimeout(() => i.focus(), 50);
  $('#pOk').onclick = () => { const v = i.value.trim(); closeModal(); fn(v); };
  if (!multi) i.onkeydown = e => { if (e.key === 'Enter') $('#pOk').click(); };
}
let toastT;
function toast(msg, kind = '', ms = 2200) { const t = $('#toast'); t.textContent = msg; t.className = 'toast show ' + kind; clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', ms); }

/* ---------- mode & wiring ---------- */
function setMode(m) {
  mode = m; sel = null;
  $('#mInspect').classList.toggle('on', m === 'inspect'); $('#mEdit').classList.toggle('on', m === 'edit');
  if (m === 'edit') { openPlanPanel(); } else if (drawer) { drawer = null; drawerEl.classList.remove('open'); document.body.classList.remove('drawer-open'); }
  render(); fit();
}
function buildPalette() {
  const closed = settings.palClosed || ['e', 's', 'b'];
  $('#palette').innerHTML = GROUPS.map(([g, gn]) => `<div class="pg ${closed.includes(g) ? 'closed' : ''}" data-g="${g}"><h4 role="button" tabindex="0">${gn}<i>▾</i></h4><div class="pi">` +
    Object.entries(TYPES).filter(([, v]) => v.g === g).map(([k, v]) => `<button data-t="${k}" title="เพิ่ม${v.n}">${previewSvg(k)}<span>${v.n}</span></button>`).join('') + '</div></div>').join('');
  document.querySelectorAll('#palette button').forEach(b => b.onclick = () => addObject(b.dataset.t));
  document.querySelectorAll('#palette h4').forEach(h => h.onclick = () => {
    const pg = h.parentElement; pg.classList.toggle('closed');
    settings.palClosed = [...document.querySelectorAll('#palette .pg.closed')].map(x => x.dataset.g); saveSettings(); });
}
$('#mInspect').onclick = () => setMode('inspect');
$('#mEdit').onclick = () => setMode('edit');
$('#planSel').onchange = e => switchPlan(e.target.value);
$('#dateIn').max = today(); $('#dateIn').value = viewDate;
$('#dateIn').onchange = e => { if (e.target.value) setDate(e.target.value); };
$('#bToday').onclick = () => setDate(today());
$('#bIssues').onclick = () => drawer && drawer.kind === 'issues' ? closeDrawer() : openIssuesPanel();
$('#bHistory').onclick = () => drawer && drawer.kind === 'history' ? closeDrawer() : openHistory();
$('#bReport').onclick = openReport;
$('#bSettings').onclick = openSettings;
$('#bSync').onclick = openSync;
$('#zIn').onclick = () => zoomAt(1.25); $('#zOut').onclick = () => zoomAt(.8); $('#zFit').onclick = fit;
$('#tUndo').onclick = undo; $('#tRedo').onclick = redo;
$('#tSnap').onclick = () => { settings.snap = !settings.snap; saveSettings(); updTools(); toast(settings.snap ? 'ยึดกริด: เปิด (หมุนทีละ 15°)' : 'ยึดกริด: ปิด'); };
$('#tLabels').onclick = () => { settings.showLabels = !settings.showLabels; saveSettings(); updTools(); render(); };
$('#tPlanSet').onclick = () => { sel = null; render(); openPlanPanel(); };
$('#tAI').onclick = openAIModal;
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select')) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mode === 'edit' && sel && (e.key === 'Delete' || e.key === 'Backspace')) { e.preventDefault(); deleteSel(); }
  else if (e.key === 'Escape') { if ($('#mwrap').classList.contains('show')) closeModal(); else if (drawer) closeDrawer(); }
});
window.addEventListener('resize', () => render());
// date rollover (app left open overnight)
setInterval(() => { const t = today(); if ($('#dateIn').max !== t) { const wasToday = viewDate === $('#dateIn').max; $('#dateIn').max = t; if (wasToday) setDate(t); } }, 60000);

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
applyLogo(); fillPlanSel(); buildPalette(); updTools(); setDate(viewDate); requestAnimationFrame(fit);
setSync(fbConfig() ? 'signedout' : 'off'); fbStart();
</script>
</body>
</html>
